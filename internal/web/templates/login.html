{{define "login.html"}}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/icon.svg" alt="CCP Switcher" class="login-logo">
      <div>
        <h1 class="login-title">CCP Switcher</h1>
        <p class="login-subtitle">统一 AI 编程网关控制台</p>
      </div>
    </div>

    {{if and .Error (ne .Error "login required")}}
    <div class="login-alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{.Error}}
    </div>
    {{end}}

    <form method="post" action="/login" class="login-form">
      <label class="login-field">
        <span class="login-label">登录密码</span>
        <input class="login-input" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" autofocus required>
      </label>
      <button class="login-btn" type="submit">身份核验</button>
    </form>

    <p class="login-hint">首次启动凭据文件：<code>{{.BootstrapPath}}</code></p>
  </div>
</div>
{{end}}
