name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$version" ]]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            input_tag="${{ inputs.tag }}"
            tag_name="${input_tag:-$version}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ "$tag_name" != "$version" ]]; then
            echo "Tag ${tag_name} does not match VERSION ${version}." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} does not exist in the repository." >&2
            exit 1
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: |
          go test ./...

  build:
    needs:
      - resolve-version
      - verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          archive_dir="dist/ccp-switcher_${VERSION}_linux_${GOARCH}"
          archive_name="ccp-switcher_${VERSION}_linux_${GOARCH}.tar.gz"

          mkdir -p "${archive_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${archive_dir}/ccp-switcher" ./cmd/ai-webui
          install -m 755 install.sh "${archive_dir}/install.sh"
          install -m 644 contrib/ccp-switcher.service "${archive_dir}/ccp-switcher.service"
          install -m 644 README.md "${archive_dir}/README.md"
          install -m 644 VERSION "${archive_dir}/VERSION"

          tar -C dist -czf "dist/${archive_name}" "$(basename "${archive_dir}")"
          rm -rf "${archive_dir}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - resolve-version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
